
<div class="rich-editor">

    <div class="richtext-toolbar" id="toolbar">

    <!-- Font -->
    <div class="tool-group">

        <select class="font-family" title="Font">
            <option value="Arial">Arial</option>
            <option value="Calibri">Calibri</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Verdana">Verdana</option>
            <option value="Georgia">Georgia</option>
            <option value="Tahoma">Tahoma</option>
        </select>

        <select class="font-size" title="Font Size">
            <option value="1">8</option>
            <option value="2">10</option>
            <option value="3" selected>12</option>
            <option value="4">14</option>
            <option value="5">18</option>
            <option value="6">24</option>
            <option value="7">36</option>
        </select>

    </div>

    <div class="divider"></div>

    <!-- Text Formatting -->
    <div class="tool-group">

        <button type="button"
                data-command="bold"
                title="Bold">
            <b>B</b>
        </button>

        <button type="button"
                data-command="italic"
                title="Italic">
            <i>I</i>
        </button>

        <button type="button"
                data-command="underline"
                title="Underline">
            <u>U</u>
        </button>

    </div>

    <div class="divider"></div>

    <!-- Colors -->
    <div class="tool-group">

        <label class="color-tool" title="Text Color">
            <span class="text-color-icon">A</span>
            <input type="color"
                   class="text-color"
                   value="#000000">
        </label>

        <label class="color-tool" title="Highlight Color">
            <span class="highlight-color-icon">🖍</span>
            <input type="color"
                   class="highlight-color"
                   value="#ffff00">
        </label>

    </div>

    <div class="divider"></div>

    <!-- Alignment -->
    <div class="tool-group">

        <button type="button"
                data-command="justifyLeft"
                title="Align Left">
            L
        </button>

        <button type="button"
                data-command="justifyCenter"
                title="Align Center">
            C
        </button>

        <button type="button"
                data-command="justifyRight"
                title="Align Right">
            R
        </button>

    </div>

    <div class="divider"></div>

    <!-- Lists -->
    <div class="tool-group">

        <button type="button"
                data-command="insertUnorderedList"
                title="Bullet List">
            •
        </button>

        <button type="button"
                data-command="insertOrderedList"
                title="Numbered List">
            1.
        </button>

    </div>

    <div class="divider"></div>

    <!-- Clear Formatting -->
    <div class="tool-group">

        <button type="button"
                data-command="removeFormat"
                title="Clear Formatting">
            Tx
        </button>

    </div>

</div>

<div class="editor" contenteditable="true" spellcheck="true"></div>
