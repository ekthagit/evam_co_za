
<div id="purchaseOrder" class="invoice">

<div class="invoice-content">
    <div class="top-section">

        <div class="logo-section">
            <img src="logo.svg" class="company-logo" onerror="this.style.display='none'">
            <div id="companyName"></div>
            <div class="line"></div>
        </div>

        <div class="invoice-title">
            Purchase Order
        </div>

    </div>

    <div class="info-section">

    <div class="left-info">

        <div class="address-box">
            <h3>Bill To</h3>

            <span id="pBillName"></span><br>

            <div id="billVatRow">
                <span id="pBillVAT"></span>
            </div>

            <span id="pBillAddress"></span><br>
            <span id="pBillPhone"></span>
        </div>

        <div class="address-box">
            <h3>Ship To</h3>

            <span id="pShipName"></span><br>
            <span id="pShipAddress"></span><br>
            <span id="pShipPhone"></span>
        </div>

    </div>

    <div class="right-info">

        <div class="address-box">
            <h3>Purchase Order Details</h3>

            <p><strong>Purchase Order No:</strong> <span id="pPONo"></span></p>
            <p><strong>Purchase Order Date:</strong> <span id="pPODate"></span></p>
            <p><strong>Delivery Term:</strong> <span id="pDeliveryTerm"></span></p>
            <p><strong>Payment Terms:</strong> <span id="pPaymentTerms"></span></p>

        </div>

        <div class="address-box">

            <h3>Vendor Details</h3>

            <span id="pVendorName"></span><br>
            <span id="pVendorAddress"></span><br>
            <span id="pVendorPhone"></span>

        </div>

    </div>

</div>

    <table class="invoice-table">
        <thead>
        <tr>
            <th>Product Description</th>
            <th>Quantity</th>
            <th>Rate</th>
            <th>Tax</th>
            <th>Amount</th>
        </tr>
        </thead>
        <tbody id="previewRows"></tbody>
    </table>

    <div class="summary-section">
        <div class="total-section">

            <div class="total-row">
                <span>Subtotal</span>
                <span><span id="currencyLabel1"></span> <span id="sub"></span></span>
            </div>

            <div class="total-row">
                <span>TAX</span>
                <span><span id="currencyLabel2"></span> <span id="vatAmt"></span></span>
            </div>

            <div class="grand-total">
                <span>Grand Total</span>
                <span><span id="currencyLabel3"></span> <span id="grand"></span></span>
            </div>

        </div>
    </div>
    <div class="amount-words">
        <strong>Amount in Words : </strong>
        <span id="amountWords"></span>
    </div>

    <div class="notes" id="notesSection">
        <h3>Payment & Tax Notes</h3>
        <div id="previewTerms"></div>
    </div>

    
</div>
    <div class="footer-text" id="footerText"></div>

    <div class="footer">
        <div id="companyFooter"></div>
    </div>
</div>
