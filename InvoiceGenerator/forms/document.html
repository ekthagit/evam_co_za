<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Document Generator</title>

    <link rel="stylesheet" href="../css/document.css">
</head>
<body>

<div class="container">

    <!-- ==========================
         LEFT PANEL
    =========================== -->

    <aside class="controls">

        <h2>Business Document</h2>

        <div class="form-group">
            <label for="docDate">Date</label>
            <input type="date" id="docDate">
        </div>

        <div class="form-group">
            <label for="docText">Document Text</label>
            <textarea id="docText"
                placeholder="Enter your document here..."></textarea>
        </div>

        <div class="form-group">
            <label for="signName">Name</label>
            <input
                type="text"
                id="signName"
                placeholder="John Smith">
        </div>

        <div class="form-group">
            <label for="designation">Designation</label>
            <input
                type="text"
                id="designation"
                placeholder="General Manager">
        </div>

        <button id="printBtn">
            Print / Save PDF
        </button>

    </aside>



    <!-- ==========================
         RIGHT PANEL
    =========================== -->

    <main class="preview-area">

        <div id="documentContainer"></div>

    </main>

</div>

<script src="../js/document.js"></script>

</body>
</html>
